<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Meta Quest 3 Demo</title>

    <script/aframe.io/releases/1.5.0/aframe.min.jsscript>
</head>

<body>

<a-scene>

    <a-sky color="#222"></a-sky>

    <a-box
        position="-1 1.5 -3"
        color="red">
    </a-box>

    <a-sphere
        position="1 1.5 -3"
        radius="0.5"
        color="blue">
    </a-sphere>

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="green">
    </a-plane>

</a-scene>

</body>
</html>
